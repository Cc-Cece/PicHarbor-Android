<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf8ff">
  <meta name="description" content="云备份 Android 应用交互原型。纯前端演示，无真实登录、上传或删除。">
  <title>云备份 · Android 交互原型</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.7-9.95A6 6 0 0 1 18 7a5.5 5.5 0 0 1-.5 11H7Z"/></symbol>
    <symbol id="i-cloud-check" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.7-9.95A6 6 0 0 1 18 7a5.5 5.5 0 0 1-.5 11H7Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-cloud-up" viewBox="0 0 24 24"><path d="M6 18a5 5 0 0 1 .3-9.95A6 6 0 0 1 18 7a5.5 5.5 0 0 1 1 10.8M12 20V10m-4 4 4-4 4 4"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.5 2a8 8 0 0 0-2 1.2L4.5 6 3 8.5 4.5 10a8 8 0 0 0 0 3L3 14.5 4.5 17l2-.2a8 8 0 0 0 2 1.2L9 21h6l.5-3a8 8 0 0 0 2-1.2l2 .2 1.5-2.5-1.5-1.5a8 8 0 0 0 0-3L21 8.5 19.5 6l-2 .2a8 8 0 0 0-2-1.2L15 3H9Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4m7-7-7 7 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-11 4a6 6 0 0 1 8 0m-4 4h.01"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v14H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-clean" viewBox="0 0 24 24"><path d="m14 3-4 7 6 4 5-6M9 10l-6 7 8 5 6-8M5 16l6 4m-3-6-4 5M17 2v3m3-1h-3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 3v7h-7"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><rect x="3" y="6" width="17" height="12" rx="3"/><path d="M23 10v4M6 9h10v6H6Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></symbol>
    <symbol id="i-sd" viewBox="0 0 24 24"><path d="M8 2h11v20H5V6l3-4Z"/><path d="M9 3v5m4-5v5m3-5v5M8 13h8v6H8Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
  </defs></svg>

  <div class="studio">
    <header class="studio-heading"><a class="wordmark" href="#"><span class="brand-symbol">☁</span> 云备份 <span class="version">DESIGN PREVIEW · 01</span></a><span class="studio-note">留住每一刻，轻装前行。</span></header>
    <main class="stage">
      <div class="phone-wrap"><div class="phone" id="phone">
        <div class="statusbar"><span>9:41</span><span class="camera-dot"></span><div><svg class="icon"><use href="#i-wifi"/></svg><span class="signal">▂▄▆</span><svg class="icon"><use href="#i-battery"/></svg></div></div>
        <div class="app-shell"><main id="screen" class="screen" aria-label="应用页面"></main><nav id="navigation" class="navigation" aria-label="主要导航"></nav></div>
        <div class="gesture-bar"><span></span></div>
        <div id="overlay" class="overlay-root"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div><div class="device-caption"><span class="live-dot"></span> 可交互原型 <span>·</span> Android / Material 3 Expressive</div></div>

      <aside class="control-panel" aria-label="原型演示控制">
        <div class="eyebrow">A LITTLE MORE PEACE OF MIND</div><h1>美好有备份。<br><span>手机有空间。</span></h1>
        <p class="intro">一个轻巧、安心的照片备份工具。<br>点击左侧手机，体验完整流程。</p>
        <div class="control-section"><div class="control-title">外观 <span>MATERIAL 3 EXPRESSIVE</span></div>
          <div class="appearance"><button data-action="theme" data-value="light" class="appearance-button active" id="light-button"><svg class="icon"><use href="#i-sun"/></svg>浅色</button><button data-action="theme" data-value="dark" class="appearance-button" id="dark-button"><svg class="icon"><use href="#i-moon"/></svg>深色</button></div>
          <div class="palette"><button class="swatch selected" style="--swatch:#b8a3e8" data-action="palette" data-value="lavender" aria-label="薰衣草配色"></button><button class="swatch" style="--swatch:#88b5a3" data-action="palette" data-value="sage" aria-label="鼠尾草配色"></button><button class="swatch" style="--swatch:#e1a790" data-action="palette" data-value="peach" aria-label="暖杏配色"></button><span id="palette-label">薰衣草</span></div>
        </div>
        <div class="control-section"><div class="control-title">演示场景 <span>试试不同的备份状态</span></div><div class="scenario-list">
          <button class="scenario active" data-action="scenario" data-value="pending"><span class="scenario-dot pending"></span>有照片待备份<span class="scenario-arrow">↗</span></button>
          <button class="scenario" data-action="scenario" data-value="complete"><span class="scenario-dot complete"></span>全部备份完成<span class="scenario-arrow">↗</span></button>
          <button class="scenario" data-action="scenario" data-value="wifi"><span class="scenario-dot wifi"></span>等待 Wi-Fi<span class="scenario-arrow">↗</span></button>
          <button class="scenario" data-action="scenario" data-value="error"><span class="scenario-dot error"></span>有项目需要处理<span class="scenario-arrow">↗</span></button>
          <button class="scenario" data-action="scenario" data-value="signedout"><span class="scenario-dot signedout"></span>首次使用 / 未登录<span class="scenario-arrow">↗</span></button>
        </div></div>
        <div class="control-section"><div class="control-title">快速前往</div><div class="quick-links"><button data-action="goto" data-value="folders">备份文件夹</button><button data-action="goto" data-value="cleanup">释放空间</button><button data-action="goto" data-value="settings">备份设置</button><button data-action="goto" data-value="history">任务记录</button></div></div>
        <div class="prototype-note"><svg class="icon"><use href="#i-info"/></svg><p>纯前端演示，使用示例账号与照片。<br>不会实际登录、上传或删除任何文件。</p></div>
        <button class="reset-button" data-action="reset"><svg class="icon"><use href="#i-refresh"/></svg>重置演示</button>
      </aside>
    </main>
  </div>
  <button class="mobile-demo-button" data-action="demo-menu" aria-label="打开演示控制"><svg class="icon"><use href="#i-spark"/></svg></button>
  <script src="app.js"></script>
</body>
</html>
