name: Release

# Build the release APK and publish a GitHub Release when a version tag (v*) is pushed.
# Reference: desktop/.github/workflows/release.yml & tools/build-release.ps1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag matching the app version (defaults to v + versionName)'
        required: false
        type: string
      publish:
        description: 'Publish a new immutable Release (otherwise upload build artifacts only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # required to create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and optionally publish (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - name: Check release intent and immutable version
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUBLISH_ENABLED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; fi
          FLAGS=()
          if [ "$PUBLISH_ENABLED" = true ]; then FLAGS+=(--publish); fi
          python tools/release_preflight.py --tag "$TAG" "${FLAGS[@]}"
          python tools/verify_engine.py

      - name: Configure release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PICHARBOR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PICHARBOR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PICHARBOR_KEY_PASSWORD }}
        run: |
          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="$KEYSTORE_DIR/picharbor-release.jks"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Persistent release signing secrets are required. Temporary signing keys are forbidden."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          STORE_PASS="$STORE_PASSWORD"
          KEY_PASS="$KEY_PASSWORD"

          echo "PICHARBOR_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASS"
          echo "PICHARBOR_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PASS"
          echo "PICHARBOR_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Verify pinned keystore certificate
        run: python tools/verify_signing.py --keystore "$PICHARBOR_KEYSTORE"

      - name: Run unit tests
        run: gradle testReleaseUnitTest lintRelease "-PbuildPython=$(which python)" --console=plain

      - name: Check diagnostic transport isolation
        run: |
          python -m pip install requests==2.32.5
          python tools/test_diagnostics.py

      - name: Build release APK (arm64-v8a)
        run: |
          BUILD_PYTHON=$(which python3)
          gradle assembleRelease "-PbuildPython=$BUILD_PYTHON" --console=plain

      - name: Verify signed APK release identity
        run: python tools/verify_signing.py --apk app/build/outputs/apk/release/app-release.apk

      - name: Inspect release APK integrity
        run: python tools/inspect_release.py

      - name: Archive exact-build symbol mapping
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols-${{ github.sha }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/src/main/assets/engine-baseline.json
            app/src/main/assets/engine-extension.json
            gpmc.lock.json
            app/build.gradle.kts
          retention-days: 90
          if-no-files-found: error

      - name: Package release artifacts
        run: python tools/package-release.py

      - name: Verify the source package independently
        run: python tools/verify_source_archive.py dist/*-source.zip

      - name: Compute SHA-256 checksums & prepare release notes
        id: prepare_notes
        run: |
          cd dist
          APK_FILE=$(ls PicHarbor-*-arm64.apk | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found in dist/"
            exit 1
          fi

          # Generate standard sha256 checksum file for the APK
          sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
          APK_HASH=$(cut -d ' ' -f 1 "${APK_FILE}.sha256")

          SRC_FILE=$(ls PicHarbor-*-source.zip 2>/dev/null | head -n 1)
          SRC_HASH=""
          if [ -n "$SRC_FILE" ]; then
            SRC_HASH=$(sha256sum "$SRC_FILE" | cut -d ' ' -f 1)
          fi

          TAG="${{ steps.preflight.outputs.tag }}"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "Native Google Photos backup client for Android 10+ (API 29+), built for \`arm64-v8a\` devices."
            echo ""
            echo "### Package Details"
            echo "- **Release**: \`$TAG\`"
            echo "- **Target OS**: Android 10+ (API 29+)"
            echo "- **Architecture**: \`arm64-v8a\`"
            echo "- **Engine**: Embedded Python 3.13 via Chaquopy (\`gpmc\` protocol client)"
            echo ""
            echo "### Checksums (SHA-256)"
            echo "- **$APK_FILE**: \`$APK_HASH\`"
            if [ -n "$SRC_FILE" ]; then
              echo "- **$SRC_FILE**: \`$SRC_HASH\`"
            fi
            echo ""
            echo "### Verify Download"
            echo "- **Linux / macOS**:"
            echo "  \`\`\`bash"
            echo "  sha256sum -c $APK_FILE.sha256"
            echo "  \`\`\`"
            echo "- **PowerShell (Windows)**:"
            echo "  \`\`\`powershell"
            echo "  (Get-FileHash .\\$APK_FILE -Algorithm SHA256).Hash"
            echo "  \`\`\`"
            echo ""
            echo "---"
            echo "*See [README.md](https://github.com/Cc-Cece/PicHarbor-Android) for setup, usage, and permissions.*"
          } > ../notes.md

          cd ..
          if [[ "$TAG" == "v1.0.9-beta.5" ]]; then
            cat docs/releases/1.0.9-beta.5.md >> notes.md
          fi
          cat notes.md

      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-${{ github.sha }}
          path: |
            dist/*
            gpmc.lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish a new GitHub Release
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then FLAGS+=(--prerelease --latest=false); else FLAGS+=(--latest); fi
          gh release create "$RELEASE_TAG" dist/* \
            --title "PicHarbor Android $RELEASE_TAG" \
            --notes-file notes.md --target "$GITHUB_SHA" "${FLAGS[@]}"

      - name: Cleanup signing credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keystore"
